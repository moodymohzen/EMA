<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMA SOFT – Project</title>
    <link rel="icon" type="image/png" href="Logo without BG.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b2a4a;
            --accent: #f7b500;
            --page-bg: #050814;
            --surface: #0b1022;
            --surface-raised: #111a30;
            --text: #fff;
            --text-muted: #b0b7c3;
            --border: rgba(247, 181, 0, .18);
            --nav-bg: rgba(5, 8, 20, .95);
        }

        :root[data-theme="light"] {
            --page-bg: #f5f7fb;
            --surface: #fff;
            --surface-raised: #eaf0fa;
            --text: #172033;
            --text-muted: #596579;
            --border: rgba(27, 42, 74, .14);
            --nav-bg: rgba(255, 255, 255, .96);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--page-bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            transition: background-color .25s ease, color .25s ease;
        }

        html[lang="ar"] body,
        html[lang="ar"] button {
            font-family: 'Tajawal', Tahoma, Arial, sans-serif;
        }

        a { color: inherit; text-decoration: none; }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 14px 8%;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .brand img { width: 40px; height: 40px; object-fit: contain; }

        .nav-actions { display: flex; align-items: center; gap: 8px; }

        .utility-button {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .utility-button:hover { border-color: var(--accent); color: var(--accent); }

        .page {
            width: min(1120px, 88%);
            margin: 0 auto;
            padding: 44px 0 70px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 26px;
            color: var(--text-muted);
            font-size: 14px;
            transition: color .2s ease;
        }

        .back-link:hover { color: var(--accent); }

        .back-link .back-arrow { font-size: 20px; }
        html[dir="rtl"] .back-link .back-arrow { transform: rotate(180deg); }

        .project-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
            align-items: center;
            gap: clamp(28px, 6vw, 72px);
        }

        .project-image-frame {
            overflow: hidden;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: 0 22px 60px rgba(0, 0, 0, .2);
        }

        .project-image {
            display: block;
            width: 100%;
            max-height: 600px;
            border-radius: 12px;
            object-fit: contain;
        }

        .project-copy { min-width: 0; }

        .project-label {
            display: inline-flex;
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface-raised);
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
        }

        h1 {
            margin: 18px 0 12px;
            font-size: clamp(30px, 4vw, 46px);
            line-height: 1.2;
        }

        .project-tag {
            margin-bottom: 26px;
            color: var(--accent);
            font-size: 14px;
        }

        h2 { margin: 0 0 10px; font-size: 19px; }

        .project-description {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.9;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 28px;
            padding: 11px 18px;
            border: 1px solid var(--accent);
            border-radius: 24px;
            background: var(--accent);
            color: #111;
            font-size: 14px;
            font-weight: 700;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .contact-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(247, 181, 0, .24);
        }

        .contact-link svg { width: 18px; height: 18px; fill: currentColor; }

        .not-found {
            padding: 70px 20px;
            color: var(--text-muted);
            text-align: center;
        }

        [hidden] { display: none !important; }

        @media (max-width: 760px) {
            .navbar { padding: 12px 5%; }
            .page { width: 90%; padding-top: 30px; }
            .project-layout { grid-template-columns: 1fr; gap: 28px; }
            .project-image-frame { order: 2; padding: 9px; }
            .project-copy { order: 1; }
            .project-image { max-height: 480px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a class="brand" href="index.html" aria-label="EMA SOFT">
            <img src="Logo without BG.png" alt="">
            <span>EMA SOFT</span>
        </a>
        <div class="nav-actions">
            <button class="utility-button" id="languageToggle" type="button">عربي</button>
            <button class="utility-button" id="themeToggle" type="button"></button>
        </div>
    </header>

    <main class="page">
        <a class="back-link" href="index.html#portfolio"><span class="back-arrow" aria-hidden="true">→</span><span data-i18n="projectPageBack">Back to projects</span></a>
        <article class="project-layout" id="projectDetails" hidden>
            <div class="project-image-frame">
                <img class="project-image" id="projectImage" alt="">
            </div>
            <div class="project-copy">
                <span class="project-label" data-i18n="projectPageLabel">Selected project</span>
                <h1 id="projectTitle"></h1>
                <div class="project-tag" id="projectTag"></div>
                <h2 data-i18n="projectPageOverview">Project overview</h2>
                <p class="project-description" id="projectDescription"></p>
                <a class="contact-link" href="index.html?openWhatsApp=1#whatsappChat">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.86 11.86 0 0 0 12.08 0C5.5 0 .14 5.35.13 11.94c0 2.1.55 4.15 1.61 5.96L0 24l6.25-1.64a11.9 11.9 0 0 0 5.82 1.48h.01c6.58 0 11.94-5.36 11.94-11.94a11.86 11.86 0 0 0-3.5-8.42ZM12.08 21.8h-.01a9.9 9.9 0 0 1-5.04-1.37l-.36-.21-3.71.97.99-3.62-.24-.37a9.89 9.89 0 0 1-1.52-5.26c0-5.47 4.45-9.92 9.9-9.92a9.85 9.85 0 0 1 7.02 2.91 9.85 9.85 0 0 1 2.9 7.02c0 5.46-4.45 9.9-9.93 9.9Zm5.44-7.42c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.28-.47-2.44-1.5-.9-.8-1.5-1.78-1.67-2.08-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.68-1.64-.93-2.25-.24-.59-.49-.51-.67-.52h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.5 0 1.47 1.07 2.9 1.22 3.1.15.2 2.12 3.23 5.14 4.53.72.31 1.28.5 1.71.64.72.23 1.37.19 1.89.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>
                    <span data-i18n="projectPageContact">Discuss a similar project</span>
                </a>
            </div>
        </article>
        <div class="not-found" id="projectNotFound" hidden>
            <p data-i18n="projectPageNotFound">This project could not be found.</p>
        </div>
    </main>

    <script src="site-translations.js"></script>
    <script>
        const translations = window.SITE_TRANSLATIONS;
        const projects = {
            dashboard: { title: "projectDashboard", tag: "tagDashboard", description: "projectDashboardDescription", image: "dashboard-preview.svg", alt: "projectDashboard" },
            commerce: { title: "projectCommerce", tag: "tagCommerce", description: "projectCommerceDescription", image: "commerce-preview.svg", alt: "projectCommerce" },
            booking: { title: "projectBooking", tag: "tagBooking", description: "projectBookingDescription", image: "Design1.png", alt: "projectBooking" },
            gassel: { title: "projectGassel", tag: "tagGassel", description: "projectGasselDescription", image: "Gassel.png", alt: "projectGasselAlt" }
        };
        const project = projects[new URLSearchParams(location.search).get("project")];
        const languageToggle = document.getElementById("languageToggle");
        const themeToggle = document.getElementById("themeToggle");

        if (project) {
            const details = document.getElementById("projectDetails");
            const image = document.getElementById("projectImage");
            image.src = project.image;
            details.hidden = false;
            document.getElementById("projectTitle").dataset.i18n = project.title;
            document.getElementById("projectTag").dataset.i18n = project.tag;
            document.getElementById("projectDescription").dataset.i18n = project.description;
            image.dataset.i18nAttr = `alt:${project.alt}`;
        } else {
            document.getElementById("projectNotFound").hidden = false;
        }

        function applyLanguage(language) {
            const safeLanguage = language === "ar" ? "ar" : "en";
            document.documentElement.lang = safeLanguage;
            document.documentElement.dir = safeLanguage === "ar" ? "rtl" : "ltr";

            document.querySelectorAll("[data-i18n]").forEach(element => {
                const value = translations[safeLanguage][element.dataset.i18n];
                if (value) element.textContent = value;
            });
            document.querySelectorAll("[data-i18n-attr]").forEach(element => {
                element.dataset.i18nAttr.split(";").forEach(pair => {
                    const [attribute, key] = pair.split(":");
                    const value = translations[safeLanguage][key];
                    if (value) element.setAttribute(attribute, value);
                });
            });

            document.title = project
                ? `${translations[safeLanguage][project.title]} – EMA SOFT`
                : `EMA SOFT – ${translations[safeLanguage].projectPageNotFound}`;
            languageToggle.textContent = safeLanguage === "ar" ? "English" : "عربي";
            localStorage.setItem("ema-language", safeLanguage);
        }

        function applyTheme(theme) {
            const safeTheme = theme === "light" ? "light" : "dark";
            document.documentElement.dataset.theme = safeTheme;
            const isLight = safeTheme === "light";
            const language = document.documentElement.lang;
            themeToggle.innerHTML = `<span aria-hidden="true">${isLight ? "🌙" : "☀️"}</span> <span>${translations[language][isLight ? "darkMode" : "lightMode"]}</span>`;
            localStorage.setItem("ema-theme", safeTheme);
        }

        languageToggle.addEventListener("click", () => {
            applyLanguage(document.documentElement.lang === "ar" ? "en" : "ar");
            applyTheme(document.documentElement.dataset.theme);
        });
        themeToggle.addEventListener("click", () => {
            applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
        });

        applyLanguage(localStorage.getItem("ema-language") || "en");
        applyTheme(localStorage.getItem("ema-theme") || "dark");
    </script>
</body>
</html>
